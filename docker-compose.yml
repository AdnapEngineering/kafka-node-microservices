services:
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - '9092:9092' # for running the services on the host with `npm run dev:*`
    environment:
      # Single-node KRaft: this broker is also its own controller (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is for other containers, EXTERNAL for clients on the host.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by init-topics, so a typo'd topic name fails loudly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1',
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  init-topics:
    build: .
    command: ['node', 'dist/shared/admin.js']
    environment: &kafka-env
      KAFKA_CLIENT_ID: kafka-node-microservices
      KAFKA_BROKER: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'

  order-service:
    build: .
    command: ['node', 'dist/order-service/server.js']
    ports:
      - '3000:3000'
    environment:
      <<: *kafka-env
      ORDER_SERVICE_PORT: 3000
    depends_on:
      init-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  notification-service:
    build: .
    command: ['node', 'dist/notification-service/worker.js']
    environment: *kafka-env
    depends_on:
      init-topics:
        condition: service_completed_successfully
